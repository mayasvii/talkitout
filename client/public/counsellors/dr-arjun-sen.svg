<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="circleClipArjun">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
    <linearGradient id="bgGradArjun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6F8" />
      <stop offset="100%" stop-color="#E0ECEF" />
    </linearGradient>
  </defs>

  <!-- Outer Ring and Background -->
  <circle cx="100" cy="100" r="99" fill="#C4DCE2" />
  <circle cx="100" cy="100" r="96" fill="url(#bgGradArjun)" />

  <g clip-path="url(#circleClipArjun)">
    <!-- Shoulders and Torso -->
    <!-- Earthy Sage Linen Kurta -->
    <path d="M 38 210 Q 46 146 74 135 L 100 146 L 126 135 Q 154 146 162 210 Z" fill="#7FA68A" />
    <!-- Mandarin Collar -->
    <path d="M 83 133 C 83 126 117 126 117 133 L 114 143 C 114 137 86 137 86 143 Z" fill="#6B9176" />
    <!-- Center Button Placket -->
    <rect x="98" y="142" width="4" height="68" fill="#6B9176" />
    <circle cx="100" cy="154" r="2.2" fill="#3D5243" />
    <circle cx="100" cy="172" r="2.2" fill="#3D5243" />
    <circle cx="100" cy="190" r="2.2" fill="#3D5243" />

    <!-- Neck -->
    <rect x="88" y="110" width="24" height="28" rx="6" fill="#B87C4C" />
    <path d="M 88 122 Q 100 134 112 122 Z" fill="#A26839" opacity="0.4" />

    <!-- Back Hair Silhouette -->
    <ellipse cx="100" cy="80" rx="36" ry="38" fill="#252220" />

    <!-- Ears -->
    <circle cx="66" cy="95" r="6.8" fill="#B87C4C" />
    <circle cx="134" cy="95" r="6.8" fill="#B87C4C" />

    <!-- Face -->
    <ellipse cx="100" cy="94" rx="31" ry="35" fill="#B87C4C" />

    <!-- Haircut (Refined, side-swept with subtle salt-and-pepper temples) -->
    <path d="M 65 84 C 65 52 82 46 100 46 C 122 46 135 54 135 78 C 130 66 118 60 100 60 C 82 60 70 70 65 84 Z" fill="#252220" />
    <!-- Subtle salt-and-pepper streaks around temples for distinguished maturity -->
    <path d="M 67 82 Q 74 68 84 64" stroke="#8E979E" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 68 88 Q 75 76 80 72" stroke="#B0B8BF" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M 133 82 Q 126 68 116 64" stroke="#8E979E" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Eyebrows (Gentle, thoughtful) -->
    <path d="M 79 83 Q 87 80 94 83" stroke="#252220" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M 106 83 Q 113 80 121 83" stroke="#252220" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- Eyes (Kind, serene, mindfulness practitioner gaze) -->
    <ellipse cx="87" cy="92" rx="4" ry="2.8" fill="#252220" />
    <ellipse cx="113" cy="92" rx="4" ry="2.8" fill="#252220" />
    <circle cx="85.5" cy="90.5" r="1.1" fill="#FFFFFF" />
    <circle cx="111.5" cy="90.5" r="1.1" fill="#FFFFFF" />
    
    <!-- Gentle smile lines at eyes -->
    <path d="M 79 92 Q 81 94 80 96" stroke="#A26839" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 121 92 Q 119 94 120 96" stroke="#A26839" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 98 94 Q 100 103 104 103" stroke="#A26839" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Very light groomed clean chin / jaw shade -->
    <path d="M 75 106 C 75 128 86 132 100 132 C 114 132 125 128 125 106 C 121 120 112 127 100 127 C 88 127 79 120 75 106 Z" fill="#252220" opacity="0.2" />

    <!-- Mindful, Grounding Warm Smile -->
    <path d="M 91 114 Q 100 122 109 114" stroke="#753030" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 93 115 Q 100 119 107 115" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>
</svg>